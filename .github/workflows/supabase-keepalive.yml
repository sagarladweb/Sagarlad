name: Keep Supabase Active

on:
  schedule:
    # Runs every 2 days at 00:00 UTC — Supabase free-tier pauses after ~7 days
    - cron: '0 0 */2 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Keep-Alive Endpoint
        run: |
          echo "Pinging production keep-alive endpoint..."
          curl -sf https://sagarlad-platform-site.vercel.app/api/cron/keepalive || true
          curl -sf https://sagarlad-platform-admin.vercel.app/api/cron/keepalive || true
