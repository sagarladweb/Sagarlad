# Drain the newsletter queue every 15 minutes. The endpoint processes up to
# BATCH_SIZE (25) emails per call, respects the daily limit, and no-ops when
# the queue is empty. Free tier: Brevo allows 300 emails/day.
# Requires repo secret: CRON_SECRET (same value as Vercel env var).
name: Newsletter Drain
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

jobs:
  drain:
    runs-on: ubuntu-latest
    steps:
      - name: Drain newsletter queue + publish scheduled posts
        run: |
          curl -fsS \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "https://sagarlad.com/api/cron/keepalive" || true
